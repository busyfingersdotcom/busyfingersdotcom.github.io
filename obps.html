<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Object Pass Animation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .code-box {
            background: #111827;
            border-radius: 16px;
            padding: 24px;
            font-family: Consolas, monospace;
            font-size: 1.1rem;
            border: 1px solid #374151;
            white-space: pre-wrap;
            min-height: 280px;
        }

        .keyword {
            color: #60a5fa;
        }

        .function {
            color: #f472b6;
        }

        .object {
            background: #f59e0b;
            color: #111;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: bold;
            position: absolute;
            top: 120px;
            left: 0;
            opacity: 0;
            box-shadow: 0 0 20px rgba(245, 158, 11, .6);
        }

        .param {
            position: absolute;
            top: 120px;
            right: 180px;
            background: #10b981;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: bold;
        }

        .console-box {
            background: #020617;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            min-height: 80px;
            color: #22c55e;
            font-family: Consolas, monospace;
        }

        .typing::after {
            content: "|";
            animation: blink .8s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        @keyframes moveObject {
            0% {
                left: 0;
                opacity: 0;
                transform: scale(.8);
            }
            20% {
                opacity: 1;
            }
            100% {
                left: calc(100% - 320px);
                opacity: 1;
                transform: scale(1);
            }
        }

        .animate-object {
            animation: moveObject 2.5s ease forwards;
        }

        .stage {
            position: relative;
            height: 220px;
        }
    </style>
</head>
<body>

<div class="container py-5">

    <h1 class="text-center mb-4 text-info">
        Passing an Object to a Function
    </h1>

    <div class="row g-4">

        <div class="col-lg-6">
            <div id="code" class="code-box"></div>
        </div>

        <div class="col-lg-6">
            <div class="stage">

                <div id="objectBox" class="object">
                    { name: "San" }
                </div>

                <div class="param">
                    person
                </div>

            </div>

            <div class="console-box mt-3">
                <div>Console Output:</div>
                <div id="consoleOutput"></div>
            </div>
        </div>

    </div>

    <div class="text-center mt-4">
        <button class="btn btn-primary btn-lg" onclick="playAnimation()">
            Replay Animation
        </button>
    </div>

</div>

<script>
const codeLines = [
`function greet(person) {`,
`    console.log(person.name);`,
`}`,
``,
`greet({ name: "San" });`
];

const codeContainer = document.getElementById("code");

function typeCode() {
    codeContainer.innerHTML = "";
    let line = 0;
    let char = 0;

    function type() {

        if (line >= codeLines.length) {
            setTimeout(startObjectAnimation, 400);
            return;
        }

        if (!codeContainer.children[line]) {
            const div = document.createElement("div");
            codeContainer.appendChild(div);
        }

        const current = codeLines[line];

        codeContainer.children[line].innerHTML =
            highlight(current.substring(0, char));

        char++;

        if (char <= current.length) {
            setTimeout(type, 35);
        } else {
            line++;
            char = 0;
            setTimeout(type, 180);
        }
    }

    type();
}

function highlight(text) {
    return text
        .replace(/function/g, '<span class="keyword">function</span>')
        .replace(/greet/g, '<span class="function">greet</span>')
        .replace(/console/g, '<span class="keyword">console</span>')
        .replace(/San/g, '<span style="color:#facc15">San</span>');
}

function startObjectAnimation() {
    const box = document.getElementById("objectBox");

    box.classList.remove("animate-object");
    void box.offsetWidth;
    box.classList.add("animate-object");

    setTimeout(() => {
        typeOutput("San");
    }, 2600);
}

function typeOutput(text) {
    const output = document.getElementById("consoleOutput");
    output.textContent = "";

    let i = 0;

    const timer = setInterval(() => {
        output.textContent += text[i];
        i++;

        if (i >= text.length) {
            clearInterval(timer);
        }
    }, 180);
}

function playAnimation() {
    document.getElementById("consoleOutput").textContent = "";
    typeCode();
}

playAnimation();
</script>

</body>
</html>
